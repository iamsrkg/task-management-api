spring.application.name=task-management-api

# PostgreSQL (override with env vars in any real deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks that the
# entities match it, and the application refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
# A database that was created by an earlier version of this app (before migrations) is taken
# as already being at V1; later migrations then apply on top.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=${PORT:8080}
# Trust X-Forwarded-* from the hosting platform's proxy (real client IP for rate limiting, https scheme)
server.forward-headers-strategy=framework

# JWT. The default key is for local development ONLY: it's public in this repo, so anyone
# could forge tokens with it. Always set JWT_SECRET (base64, 256+ bits) when deploying.
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
# Refresh tokens: 7 days, single use (each refresh hands out a new one)
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Seeded admin account (set ADMIN_PASSWORD when deploying)
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Browser origins allowed to call the API (comma-separated, patterns allowed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://iamsrkg.github.io}

# Token-bucket rate limiting per client IP
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:20}
app.rate-limit.refill-per-second=${RATE_LIMIT_REFILL_PER_SECOND:5}
# memory: buckets live in this instance (fine for one instance)
# redis:  buckets live in Redis, so every instance shares one limit (set REDIS_HOST)
app.rate-limit.store=${RATE_LIMIT_STORE:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
# Redis is optional, so it only counts towards health when it is actually in use
management.health.redis.enabled=${RATE_LIMIT_REDIS_HEALTH:false}

# Health endpoint for the platform's health checks; nothing else is exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Request id on every log line
logging.pattern.level=%5p [%X{requestId:-}]
