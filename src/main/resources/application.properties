spring.application.name=task-management-api

# PostgreSQL (override with env vars in any real deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate: "update" keeps the schema in sync with the @Entity classes (fine for a demo;
# a production system would use Flyway/Liquibase migrations instead).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=${PORT:8080}
# Trust X-Forwarded-* from the hosting platform's proxy (real client IP for rate limiting, https scheme)
server.forward-headers-strategy=framework

# JWT. The default key is for local development ONLY: it's public in this repo, so anyone
# could forge tokens with it. Always set JWT_SECRET (base64, 256+ bits) when deploying.
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Seeded admin account (set ADMIN_PASSWORD when deploying)
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Browser origins allowed to call the API (comma-separated, patterns allowed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://iamsrkg.github.io}

# Token-bucket rate limiting per client IP
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:20}
app.rate-limit.refill-per-second=${RATE_LIMIT_REFILL_PER_SECOND:5}

# Health endpoint for the platform's health checks; nothing else is exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Request id on every log line
logging.pattern.level=%5p [%X{requestId:-}]
