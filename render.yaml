# Render Blueprint: deploys the API from the Dockerfile.
# Database: a free Neon PostgreSQL. Paste its JDBC URL, user and password when Render asks.
services:
  - type: web
    name: task-management-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # From Neon: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Random 256-bit base64 values generated by Render, never committed
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      # Only the portfolio (and local dev) may call the API from a browser
      - key: CORS_ALLOWED_ORIGINS
        value: https://iamsrkg.github.io,http://localhost:*,http://127.0.0.1:*
      # Keep the free instance within its 512 MB
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
