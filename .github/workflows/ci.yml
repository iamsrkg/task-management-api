name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t task-management-api .

  # Starts the app exactly the way the "Open in Codespaces" button does, and checks it answers.
  codespace:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            docker compose up -d --build
            for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 5; done
            curl -sf http://localhost:8080/actuator/health
            curl -sf http://localhost:8080/v3/api-docs | grep -q '"Task Management API"'
            test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 302
            LOGIN=$(curl -sf -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"admin123"}')
            echo "$LOGIN" | grep -q '"token"'
            # Flyway built the schema in the real PostgreSQL, and Hibernate accepted it (the app would not have started otherwise)
            test "$(docker compose exec -T db psql -U postgres -d task_db -tAc 'select count(*) from flyway_schema_history where success')" = 2
            # a refresh token buys a new pair once, and only once
            REFRESH=$(echo "$LOGIN" | sed -E 's/.*"refreshToken":"([^"]+)".*//')
            curl -sf -X POST http://localhost:8080/api/auth/refresh -H 'Content-Type: application/json' -d "{\"refreshToken\":\"$REFRESH\"}" | grep -q '"refreshToken"'
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/refresh -H 'Content-Type: application/json' -d "{\"refreshToken\":\"$REFRESH\"}")" = 401
            # the rate limit buckets are in Redis, and the limit is enforced
            docker compose exec -T redis redis-cli --scan --pattern 'ratelimit:*' | grep -q ratelimit
            seq 1 200 | xargs -P 25 -I{} curl -s -o /dev/null -w '%{http_code}
' http://localhost:8080/api/tasks | sort | uniq -c
            seq 1 200 | xargs -P 25 -I{} curl -s -o /dev/null -w '%{http_code}
' http://localhost:8080/api/tasks | grep -q 429
            echo "Codespace start-up check passed"
