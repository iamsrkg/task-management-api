name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t task-management-api .

  # Starts the app exactly the way the "Open in Codespaces" button does, and checks it answers.
  codespace:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            docker compose up -d --build
            for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 5; done
            curl -sf http://localhost:8080/actuator/health
            curl -sf http://localhost:8080/v3/api-docs | grep -q '"Task Management API"'
            test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 302
            curl -sf -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"admin123"}' | grep -q token
            echo "Codespace start-up check passed"
