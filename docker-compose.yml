services:
  db:
    image: postgres:15-alpine
    container_name: task_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The API only starts once Postgres actually accepts connections (not just "container started").
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: task_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/task_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Optional overrides (JWT_SECRET, ADMIN_PASSWORD, ...) for anything beyond local development.
    env_file:
      - path: .env
        required: false

volumes:
  postgres_data:
